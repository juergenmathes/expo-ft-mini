[project]
name = "d3il-flow"
version = "0.1.0"
description = "Flow-matching policies (CFM-BC + RL hooks) on the D3IL Avoiding task"
requires-python = "==3.10.*"
dependencies = [
    # --- sim / env (versions = DPPO fork of D3IL, known-good) ---
    "gym==0.22.0",
    "mujoco==3.1.6",
    "numpy<2",
    "pin>=2.6,<3",             # pinocchio wheels, used by d3il_sim.core.Model
    "gin-config>=0.5",
    "scipy>=1.10",
    "glfw>=2.6",
    "imageio>=2.31",
    "opencv-python-headless>=4.8",
    "pyyaml>=6",
    # --- D3IL fork, editable (cloned by set_me_up.sh / just setup) ---
    "d3il_sim",
    "gym_avoiding",
    # --- learning (torch comes from the cpu|cu124|cu128 extra -> always `uv sync --extra <one of them>`) ---
    "einops>=0.8",
    "tqdm>=4.66",
    "matplotlib>=3.7",
    "gdown>=5.2",
]

[project.optional-dependencies]
cpu = ["torch==2.4.0"]
cu124 = ["torch==2.4.0"]
cu128 = ["torch==2.8.0"]  # Blackwell (sm_120) needs >=2.7 built against CUDA 12.8
dev = ["ruff>=0.5", "ipython", "pytest"]
wandb = ["wandb>=0.17"]

[project.scripts]
d3il-flow-train = "d3il_flow.train:main"
d3il-flow-eval = "d3il_flow.eval:main"
d3il-flow-smoke = "d3il_flow.env:smoke_test"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }, { extra = "cu128" }]]

[tool.uv.sources]
d3il_sim = { path = "third_party/d3il/environments/d3il", editable = true }
gym_avoiding = { path = "third_party/d3il/environments/d3il/envs/gym_avoiding_env", editable = true }
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/d3il_flow"]

[tool.ruff]
line-length = 100
target-version = "py310"
